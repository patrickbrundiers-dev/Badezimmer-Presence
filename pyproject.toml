[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true
force-sort-within-sections = true
